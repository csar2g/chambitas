<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary": "#ffffff",
                    "outline-variant": "#c4c8bf",
                    "surface-container-lowest": "#ffffff",
                    "primary": "#54624f",
                    "surface": "#fcf9f8",
                    "secondary-container": "#ffb7b2",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed-variant": "#5a422f",
                    "secondary-fixed": "#ffdad7",
                    "tertiary-fixed-dim": "#e3c0a8",
                    "inverse-surface": "#313030",
                    "on-primary": "#ffffff",
                    "inverse-primary": "#bbcbb3",
                    "surface-bright": "#fcf9f8",
                    "on-secondary-fixed-variant": "#6b3836",
                    "tertiary-fixed": "#ffdcc4",
                    "on-surface-variant": "#444841",
                    "on-error": "#ffffff",
                    "primary-fixed": "#d7e7ce",
                    "on-background": "#1c1b1b",
                    "surface-variant": "#e5e2e1",
                    "surface-tint": "#54624f",
                    "on-secondary-fixed": "#360e0d",
                    "background": "#fcf9f8",
                    "error": "#ba1a1a",
                    "error-container": "#ffdad6",
                    "surface-container-highest": "#e5e2e1",
                    "secondary": "#874f4c",
                    "surface-container-low": "#f6f3f2",
                    "on-surface": "#1c1b1b",
                    "outline": "#747871",
                    "primary-fixed-dim": "#bbcbb3",
                    "primary-container": "#d9e9d0",
                    "on-error-container": "#93000a",
                    "on-tertiary-fixed": "#2a1708",
                    "surface-dim": "#dcd9d9",
                    "secondary-fixed-dim": "#fcb4b0",
                    "tertiary": "#745945",
                    "tertiary-container": "#ffdec8",
                    "on-secondary-container": "#7b4542",
                    "on-primary-fixed-variant": "#3d4b38",
                    "on-primary-container": "#5b6955",
                    "surface-container-high": "#eae7e7",
                    "surface-container": "#f0eded",
                    "on-tertiary-container": "#7b604c",
                    "inverse-on-surface": "#f3f0ef",
                    "on-primary-fixed": "#121f0f"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "lg": "48px",
                    "gutter": "24px",
                    "xs": "4px",
                    "sm": "12px",
                    "base": "8px",
                    "xl": "80px",
                    "md": "24px",
                    "container-max": "1200px"
            },
            "fontFamily": {
                    "headline-xl": ["Plus Jakarta Sans"],
                    "body-lg": ["Manrope"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "label-md": ["Manrope"],
                    "caption": ["Manrope"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "body-md": ["Manrope"]
            },
            "fontSize": {
                    "headline-xl": ["48px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "caption": ["12px", {"lineHeight": "1.4", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "1.25", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(217, 233, 208, 0.5);
        }
    </style>
</head>
<body class="bg-background font-body-md text-on-background min-h-screen pb-24">
<form action="{% url 'edit_profile' %}" enctype="multipart/form-data" method="POST">
{% csrf_token %}
<!-- TopAppBar -->
<header class="bg-white/80 dark:bg-zinc-900/80 backdrop-blur-md border-b border-emerald-100 dark:border-emerald-900/30 shadow-sm shadow-emerald-900/5 docked full-width top-0 z-50 flex justify-between items-center w-full px-4 h-16 sticky">
<a class="hover:bg-emerald-50 dark:hover:bg-emerald-900/20 transition-colors active:scale-95 transition-transform duration-150 p-2 rounded-full flex items-center justify-center text-zinc-500" href="{% url 'main_profile' %}">
<span class="material-symbols-outlined" data-icon="close">close</span>
</a>
<h1 class="font-['Plus_Jakarta_Sans'] font-semibold text-lg text-zinc-900 dark:text-white">Edit Profile</h1>
<button class="text-emerald-600 dark:text-emerald-400 font-['Plus_Jakarta_Sans'] font-semibold text-lg hover:bg-emerald-50 dark:hover:bg-emerald-900/20 transition-colors active:scale-95 transition-transform duration-150 px-4 py-1 rounded-lg" type="submit">
            Save
        </button>
</header>
<main class="max-w-container-max mx-auto px-4 mt-8 flex flex-col gap-8">
<!-- Profile Photo Section -->
<section class="flex flex-col items-center gap-4">
<div class="relative group">
<div class="w-32 h-32 rounded-full overflow-hidden border-4 border-primary-container shadow-lg">
<img alt="Profile picture" class="w-full h-full object-cover" data-alt="Default gray profile icon" id="profile-photo-preview" src="{% if perfil.foto_perfil %}{{ perfil.foto_perfil.url }}{% else %}https://www.gravatar.com/avatar/00000000000000000000000000000000?d=mp&f=y{% endif %}"/>
</div>
<input accept="image/*" class="hidden" id="profile-photo-input" name="foto_perfil" type="file"/>
<label class="absolute bottom-0 right-0 bg-primary-container text-on-primary-container p-2 rounded-full shadow-md hover:scale-105 active:scale-90 transition-transform cursor-pointer" for="profile-photo-input">
<span class="material-symbols-outlined" data-icon="photo_camera">photo_camera</span>
</label>
</div>
<p class="font-label-md text-on-surface-variant">Tap to change photo</p>
</section>
<!-- Form Content -->
<div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
<!-- Bio Section -->
<div class="lg:col-span-8 flex flex-col gap-6">
<div class="glass-card p-md rounded-xl flex flex-col gap-sm">
<label class="font-label-md text-primary flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]" data-icon="description">description</span>
                        Professional Biography
                    </label>
<textarea class="w-full min-h-[160px] bg-primary-container/30 border border-outline-variant rounded-lg p-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all font-body-md text-on-surface resize-none" name="descripcion" placeholder="Tell us about your experience, skills and what you are passionate about... (Min 100 characters)">{{ perfil.descripcion }}</textarea>
<div class="flex justify-end">
<span class="text-caption text-outline">0 / 500</span>
</div>
</div>
<!-- Contact Section -->
<div class="glass-card p-md rounded-xl flex flex-col gap-md">
<h3 class="font-headline-md text-on-surface flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="contact_phone">contact_phone</span>
                        Contact
                    </h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-outline">Phone Number</label>
<div class="flex items-center bg-surface-container-low border border-outline-variant rounded-lg px-sm h-12">
<span class="material-symbols-outlined text-outline-variant mr-xs" data-icon="call">call</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md" name="numero_tel" placeholder="+52 000 000 0000" type="tel" value="{{ perfil.numero_tel }}"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-outline">WhatsApp</label>
<div class="flex items-center bg-surface-container-low border border-outline-variant rounded-lg px-sm h-12">
<span class="material-symbols-outlined text-emerald-600 mr-xs" data-icon="chat">chat</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md" name="whatsapp" placeholder="+52 000 000 0000" type="tel" value="{{ perfil.whatsapp }}"/>
</div>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-outline">Location</label>
<div class="flex items-center bg-surface-container-low border border-outline-variant rounded-lg px-sm h-12">
<span class="material-symbols-outlined text-outline-variant mr-xs" data-icon="location_on">location_on</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md" name="ubicacion" placeholder="City, country or region" type="text" value="{{ perfil.ubicacion }}"/>
</div>
</div>
</div>
</div>
<!-- Links Sidebar Section -->
<aside class="lg:col-span-4 flex flex-col gap-6">
<div class="glass-card p-md rounded-xl flex flex-col gap-md">
<div class="flex justify-between items-center">
<h3 class="font-headline-md text-on-surface">Links</h3>
</div>
<div class="flex flex-col gap-sm">
<!-- Portfolio Link -->
<div class="p-sm bg-surface-container rounded-lg border border-outline-variant/30 flex flex-col gap-xs">
<div class="flex items-center">
<input class="w-full bg-surface-container-lowest font-label-md text-on-surface border border-outline-variant/50 focus:border-primary focus:ring-1 focus:ring-primary rounded px-2 py-1 transition-all shadow-sm" name="portfolio_nombre" placeholder="Title" type="text" value="{{ portfolio_nombre|default:'Portfolio' }}"/>
</div>
<div class="flex items-center gap-xs text-outline px-1 mt-1">
<span class="material-symbols-outlined text-[16px]" data-icon="link">link</span>
<input class="bg-transparent font-caption text-outline border-none p-0 focus:ring-0 w-full" name="portfolio_url" placeholder="URL" type="url" value="{{ portfolio_url }}"/>
</div>
</div>
<!-- LinkedIn Link -->
<div class="p-sm bg-surface-container rounded-lg border border-outline-variant/30 flex flex-col gap-xs">
<div class="flex items-center">
<input class="w-full bg-surface-container-lowest font-label-md text-on-surface border border-outline-variant/50 focus:border-primary focus:ring-1 focus:ring-primary rounded px-2 py-1 transition-all shadow-sm" name="linkedin_nombre" placeholder="Title" type="text" value="{{ linkedin_nombre|default:'LinkedIn' }}"/>
</div>
<div class="flex items-center gap-xs text-outline px-1 mt-1">
<span class="material-symbols-outlined text-[16px]" data-icon="link">link</span>
<input class="bg-transparent font-caption text-outline border-none p-0 focus:ring-0 w-full" name="linkedin_url" placeholder="URL" type="url" value="{{ linkedin_url }}"/>
</div>
</div>
</div>
<div class="glass-card p-md rounded-xl flex flex-col gap-sm">
<label class="font-label-md text-primary flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]" data-icon="auto_awesome">auto_awesome</span>
                        Skills (separated by comma)
                    </label>
<div class="flex items-center bg-surface-container-low border border-outline-variant rounded-lg px-sm min-h-12 py-2">
<span class="material-symbols-outlined text-primary mr-xs flex-shrink-0" data-icon="auto_awesome">auto_awesome</span>
<input class="bg-transparent border-none focus:ring-0 w-full font-body-md" name="aptitudes" placeholder="UI/UX, Branding, Figma, ..." type="text" value="{{ aptitudes_texto }}"/>
</div>
</div>
</aside>
</div>
</main>

<script>
      (function () {
        const fileInput = document.getElementById("profile-photo-input");
        const preview = document.getElementById("profile-photo-preview");

        if (!fileInput || !preview) return;

        fileInput.addEventListener("change", function (event) {
          const file = event.target.files && event.target.files[0];
          if (!file) return;
          preview.src = URL.createObjectURL(file);
        });
      })();
    </script>
</form>
</body></html>
