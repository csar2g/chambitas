{% load static %}

<!-- CREACION DE PUBLICACION -->

		<div id="modal-post" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-[100]">
			<div class="bg-white w-[600px] max-w-[90%] rounded-xl p-6">
				<h2 class="text-lg font-bold mb-4">Crear publicación</h2>
				<form id="form-publicacion" method="POST" action="{% url 'crear_publicacion' %}" enctype="multipart/form-data" class="flex flex-col gap-4">
					{% csrf_token %}
					<div class="flex items-center gap-3">
						<div class="w-12 h-12 rounded-full overflow-hidden border-2 border-white">
							{% if user.perfil.foto_perfil %}
							<img src="{{ user.perfil.foto_perfil.url }}" class="w-full h-full object-cover">
							{% else %}
							<img src="/static/img/default.jpg" class="w-full h-full object-cover">
							{% endif %}
						</div>
						<div>
							<p class="text-sm font-bold text-emerald-900">{{ user.get_full_name }}</p>
							<p class="text-[10px] uppercase tracking-widest text-emerald-700/70 font-bold">{{ user.username }}</p>
						</div>
					</div>

					<!-- DESCRIPCION -->
					<textarea
						name="descripcion"
						class="w-full h-32 bg-surface-container rounded-2xl p-4 hover:bg-surface-container-high transition-colors resize-none"
						required
						placeholder="¿What's on your mind, {{ user.first_name }}?"></textarea>

					<!-- INPUT LINK (oculto por defecto) -->
					<div id="contenedor-link" class="hidden flex items-center gap-2 bg-surface-container rounded-2xl px-4 py-3">
						<span class="material-symbols-outlined text-primary text-[20px]">link</span>
						<input
							type="url"
							name="link"
							id="input-link"
							placeholder="https://enlace.com"
							class="flex-1 bg-transparent border-none focus:ring-0 text-sm"/>
						<button type="button" onclick="quitarLink()"
							class="material-symbols-outlined text-on-surface-variant text-[18px] hover:text-error transition-colors">
							close
						</button>
					</div>

					<!-- BOTONES MEDIA -->
					<div class="flex gap-2">
						<input class="hidden" type="file" name="imagen" id="input-imagen" onchange="previewImagen(event)" multiple>
						<button
							type="button"
							onclick="document.getElementById('input-imagen').click()"
							class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-primary-container/30 text-primary font-label-md transition-colors">
							<span class="material-symbols-outlined text-[20px]">image</span>
							<span>Media</span>
						</button>
						<button
							type="button"
							onclick="mostrarLink()"
							id="btn-link"
							class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-primary-container/30 text-primary font-label-md transition-colors">
							<span class="material-symbols-outlined text-[20px]">link</span>
							<span>Link</span>
						</button>
					</div>

					<!-- PREVIEW IMAGENES -->
					<div id="contenedor-imagenes" class="flex gap-2 flex-wrap mt-2"></div>

					<!-- ACCIONES -->
					<div class="flex justify-end gap-2">
						<button type="button" onclick="cerrarModal()"
							class="px-6 py-2 rounded-full border border-emerald-600 text-emerald-600 text-sm font-semibold hover:bg-emerald-50">
							Cancelar
						</button>
						<button type="submit"
							class="bg-primary text-white px-5 py-2 rounded-full font-label-md hover:shadow-md transition-all">
							Publicar
						</button>
					</div>
				</form>
			</div>
		</div>		

		<!--VISUALIZAR IMAGENES DE PUBLICACION-->
		<div id="modal-img" 
		class="fixed inset-0 bg-black/80 hidden items-center justify-center z-[100]"
			onclick="cerrarImagen()">

			<img id="img-grande" class="max-w-[90%] max-h-[90%] rounded-lg">
		</div>
		
		<!-- Modal editar publicación -->
	<div id="modal-editar" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-[100]">
			<div class="bg-white w-[600px] max-w-[90%] rounded-xl p-6 max-h-[90vh] overflow-y-auto">
				<h2 class="text-lg font-bold mb-4">Editar publicación</h2>
				<form id="form-editar" method="POST" action="" enctype="multipart/form-data" class="flex flex-col gap-4">
					{% csrf_token %}

					<!-- Descripción -->
					<textarea id="textarea-editar" name="descripcion"
						class="w-full h-32 bg-surface-container rounded-2xl p-4 hover:bg-surface-container-high transition-colors resize-none"
						required></textarea>

					<!-- Link actual -->
					<div id="contenedor-link-editar" class="hidden flex items-center gap-2 bg-surface-container rounded-2xl px-4 py-3">
						<span class="material-symbols-outlined text-primary text-[20px]">link</span>
						<input type="url" name="link" id="input-link-editar"
							placeholder="https://tu-portafolio.com"
							class="flex-1 bg-transparent border-none focus:ring-0 text-sm"/>
						<button type="button" onclick="quitarLinkEditar()"
							class="material-symbols-outlined text-on-surface-variant text-[18px] hover:text-error transition-colors">
							close
						</button>
					</div>

					<!-- Imágenes actuales -->
					<div id="imagenes-actuales" class="flex flex-wrap gap-2"></div>

					<!-- Botones agregar media -->
					<div class="flex gap-2">
						<input class="hidden" type="file" id="input-imagen-editar" name="imagen" multiple
							onchange="previewImagenEditar(event)"/>
						<button type="button" onclick="document.getElementById('input-imagen-editar').click()"
							class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-primary-container/30 text-primary font-label-md transition-colors">
							<span class="material-symbols-outlined text-[20px]">image</span>
							<span>Agregar imagen</span>
						</button>
						<button type="button" onclick="mostrarLinkEditar()" id="btn-link-editar"
							class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-primary-container/30 text-primary font-label-md transition-colors">
							<span class="material-symbols-outlined text-[20px]">link</span>
							<span>Agregar link</span>
						</button>
					</div>

					<!-- Preview de imágenes nuevas -->
					<div id="preview-imagenes-editar" class="flex gap-2 flex-wrap"></div>

					<div class="flex justify-end gap-2">
						<button type="button" onclick="cerrarEditar()"
							class="px-6 py-2 rounded-full border border-emerald-600 text-emerald-600 text-sm font-semibold hover:bg-emerald-50">
							Cancelar
						</button>
						<button type="submit"
							class="bg-primary text-white px-5 py-2 rounded-full font-label-md hover:shadow-md transition-all">
							Guardar
						</button>
					</div>
				</form>
			</div>
		</div>

		<!-- Modal confirmar eliminación -->
	<div id="modal-eliminar" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-[100]">
				<div class="bg-white w-[400px] max-w-[90%] rounded-xl p-6 flex flex-col gap-4">
					<h2 class="text-lg font-bold">¿Eliminar publicación?</h2>
					<p class="text-on-surface-variant text-sm">Esta acción no se puede deshacer.</p>
					<div class="flex justify-end gap-2">
						<button onclick="document.getElementById('modal-eliminar').classList.add('hidden')"
							class="px-6 py-2 rounded-full border border-emerald-600 text-emerald-600 text-sm font-semibold hover:bg-emerald-50">Cancelar</button>
						<button id="btn-confirmar-eliminar"
							class="bg-red-600 text-white px-5 py-2 rounded-full text-sm font-semibold hover:bg-red-700">Eliminar</button>
					</div>
				</div>
			</div>
